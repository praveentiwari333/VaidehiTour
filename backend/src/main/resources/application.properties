# ===============================
# ✅ Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# ✅ Application Info (optional)
# ===============================
spring.application.name=vaidehi-backend

# ===============================
# ✅ Email via Brevo API (no SMTP)
# ===============================
# We’re using the Brevo API directly, not SMTP — 
# So no spring.mail.* properties are required.
# The API key will be injected via environment variable on Render.
brevo.api.key=${BREVO_API_KEY}



